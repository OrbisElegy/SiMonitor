name: 程序逻辑 Bug / Program bug
description: 崩溃、界面、设置、声音或其他程序行为异常 / Crashes, UI, settings, audio, or logic errors.
title: "[Bug] "
labels: [bug, "area:program", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请一事一报；波形形态、生理合理性或测量结果的问题请使用“波形问题”表单。
        Report one problem per issue. Use the waveform form for morphology, physiology, or measurement concerns.
        附件请移除个人信息、密钥和患者标识。Remove personal information, secrets, and patient identifiers from attachments.
  - type: dropdown
    id: issue-type
    attributes:
      label: 反馈类型 / Issue type
      options:
        - 程序逻辑 Bug / Program bug
      default: 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与来源 / Version and source
      description: 关于页版本、下载来源；源码构建请附 commit 和构建命令。About version and download source; include commit and build command for source builds.
      placeholder: "Version / commit; release package or source build; download URL"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 操作系统版本、CPU 架构；界面问题请随附缩放比例与分辨率，声音问题随附使用的输出设备。OS version, architecture; display scale/resolution for UI issues, output device for audio issues.
      placeholder: "Windows version; x64 / arm64; display scale; relevant hardware"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤 / Steps to reproduce
      description: 从启动开始列出操作、相关设置、出现频率及是否重启后仍出现。Start from launch; include settings, frequency, and whether restarting changes the result.
      placeholder: |
        1. 启动并选择…… / Launch and select ...
        2. 修改…… / Change ...
        3. 出现…… / Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为 / Expected behavior
      description: 应当发生什么？What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual behavior
      description: 实际发生什么？请包含完整错误文字（如有）。What happened? Include the complete error text (if any).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与附件 / Logs and attachments
      description: 可拖入截图、录屏或配置文件；日志请使用代码块。Attach screenshots, recordings, or configuration; put logs in fenced code blocks.
  - type: textarea
    id: regression
    attributes:
      label: 回归范围与临时解决办法 / Regression and workaround
      description: 最后正常版本、首次异常版本、尝试过的办法；未知可留空。Last working / first affected version and attempted workarounds; leave blank if unknown.
  - type: dropdown
    id: content-origin
    attributes:
      label: 内容来源与人工审核 / Content origin and human review
      description: |
        “人工审核”指人类已阅读并核验本次即将提交的完整内容；仅布置任务或批准 Agent 运行不计为审核。
        Human review means a person has read and checked the complete content of this submission. Assigning a task or authorizing an agent to run does not count as review.
      multiple: false
      options:
        - 人类编写并提交 / Written and submitted by a human
        - AI 参与编写，人类已逐项审核本次提交内容 / AI-assisted, with this submission fully reviewed by a human
        - Agent 自动提交，本次内容未经人类审核 / Submitted automatically by an AI agent without human review
        - 无法确认是否经过人类审核 / Human review status is unknown
    validations:
      required: true
  - type: dropdown
    id: pr-intent
    attributes:
      label: 是否愿意自行提交 PR？ / Will you submit a PR?
      description: 这是意愿声明，不会自动分配任务，也不影响反馈受理。This declares intent; it does not assign the issue or determine whether the report is accepted.
      options:
        - 愿意，计划自行实现并提交 PR / Yes, I plan to implement and submit a PR
        - 愿意，但需要实现指导 / Yes, with implementation guidance
        - 暂不确定，想先讨论方案 / Unsure, I would like to discuss first
        - 不计划提交 PR / No, I do not plan to submit a PR
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: 实现思路或所需帮助 / Implementation idea or help needed
      description: 若有 PR 意愿，请补充拟修改的位置、方案或需要的帮助；已有 PR 可贴链接。If interested, describe the approach, affected code, or help needed; link any existing PR.
  - type: checkboxes
    id: submission-checklist
    attributes:
      label: 提交前确认 / Submission checklist
      description: 请逐项阅读，仅勾选符合事实的声明。Read each item and check only true statements.
      options:
        - label: 我已搜索现有 issues，未找到相同反馈。 / I searched existing issues and found no duplicate.
          required: true
        - label: 我理解本项目仅用于教学模拟。 / I understand this project is for teaching simulation only.
          required: true
        - label: "I'm checking these boxes blindly."
          required: false
        - label: 我已核对以上信息，并愿意按需补充定位材料。 / I checked the information above and can provide clarification if needed.
          required: true
