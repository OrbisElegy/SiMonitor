# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI / Build and tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  repository:
    name: CI / Repository checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Check SPDX headers
        run: python tools/spdx_headers.py --check

      - name: Check localization key references
        run: python tools/check_localization_keys.py

      - name: Test repository tools
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Test issue and PR intake automation
        run: node --test .github/tests/issue-triage.test.cjs

  build:
    name: CI / Build and style (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Prepare locked dependencies
        run: python tools/fetch_dependencies.py

      - name: Verify dependency ledger
        run: python tools/verify_dependency_ledger.py

      # The Windows desktop build copies this production DLL into its output.
      - name: Build production audio library
        run: python tools/build_native_audio.py --production-only --jobs 4

      - name: Build solution (Release)
        run: dotnet build Monitor.slnx --no-restore --configuration Release

      - name: Build solution (Debug)
        run: dotnet build Monitor.slnx --no-restore --configuration Debug

      - name: Check C# style
        if: runner.os == 'Linux'
        run: |
          dotnet format style Monitor.slnx --no-restore --verify-no-changes --severity info --diagnostics IDE0007 IDE0008 IDE0040 IDE0161 IDE1006
          dotnet format whitespace Monitor.slnx --no-restore --verify-no-changes

      # Archive complete runtime directories, including resources and executable modes.
      # Do not transfer obj/ or CMake build trees between runner workspaces.
      - name: Package managed test runtimes
        shell: python
        run: |
          from pathlib import Path
          import tarfile

          archive_path = Path('artifacts/ci/managed-build.tar')
          archive_path.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, 'w') as archive:
              for directory in (
                  'src/Monitor.Desktop/bin/Release',
                  'tests/Monitor.Specs/bin/Release',
                  'tests/Monitor.Specs/bin/Debug',
              ):
                  archive.add(directory, arcname=directory)

      - name: Upload managed test runtimes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-managed-build-${{ matrix.os }}
          path: artifacts/ci/managed-build.tar
          if-no-files-found: error
          retention-days: 7

      - name: Upload build failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-build-logs-${{ matrix.os }}
          path: artifacts/native-audio/build-evidence.json
          if-no-files-found: ignore

  specifications:
    name: CI / Specifications (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Download managed test runtimes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-managed-build-${{ matrix.os }}
          path: artifacts/ci

      - name: Restore managed test runtimes
        shell: python
        run: |
          import tarfile

          with tarfile.open('artifacts/ci/managed-build.tar') as archive:
              archive.extractall('.', filter='data')

      - name: Run executable specifications
        run: python tools/run_parallel_checks.py --specs-only --configuration Release --jobs 4

      - name: Upload specification failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-specification-logs-${{ matrix.os }}
          path: artifacts/parallel-checks/
          if-no-files-found: ignore

  desktop:
    name: CI / Desktop (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Download managed test runtimes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-managed-build-${{ matrix.os }}
          path: artifacts/ci

      - name: Restore managed test runtimes
        shell: python
        run: |
          import tarfile

          with tarfile.open('artifacts/ci/managed-build.tar') as archive:
              archive.extractall('.', filter='data')

      - name: Prepare Linux desktop display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth

      - name: Run desktop checks (Linux / Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/run_parallel_checks.py --native-only --configuration Release --jobs 4

      - name: Run desktop checks (Windows)
        if: runner.os == 'Windows'
        run: python tools/run_parallel_checks.py --native-only --configuration Release --jobs 4

      - name: Upload desktop failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-desktop-logs-${{ matrix.os }}
          path: |
            artifacts/parallel-checks/
            artifacts/*.png
          if-no-files-found: ignore

  audio:
    name: CI / Audio (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Download managed test runtimes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-managed-build-${{ matrix.os }}
          path: artifacts/ci

      - name: Restore managed test runtimes
        shell: python
        run: |
          import tarfile

          with tarfile.open('artifacts/ci/managed-build.tar') as archive:
              archive.extractall('.', filter='data')

      - name: Prepare locked native dependencies
        run: python tools/fetch_dependencies.py --native-only

      - name: Build and test native audio libraries
        run: python tools/build_native_audio.py --jobs 4

      - name: Check managed/native audio binding
        run: python tools/check_native_audio_binding.py

      - name: Smoke-test managed WASAPI interop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Hosted runners usually have no audio endpoint: exit 1 (unavailable)
          # still exercises COM activation and the device enumerator.
          dotnet tests/Monitor.Specs/bin/Release/net10.0/Monitor.Specs.dll --audio-wasapi-diagnostics
          if ($LASTEXITCODE -notin 0, 1) { throw "WASAPI diagnostics failed with exit code $LASTEXITCODE" }
          exit 0

      - name: Upload audio failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-audio-logs-${{ matrix.os }}
          path: |
            artifacts/native-audio/build-evidence.json
            artifacts/native-audio-test/Testing/Temporary/
          if-no-files-found: ignore
