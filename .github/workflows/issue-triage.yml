# SPDX-License-Identifier: AGPL-3.0-or-later
name: Issue and PR intake

on:
  issues:
    types: [opened, edited]
  # Label fork PRs using trusted base-branch code; never check out or execute PR code.
  pull_request_target:
    types: [opened, edited, reopened]
  workflow_dispatch:
  push:
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - .github/workflows/issue-triage.yml

permissions:
  issues: write

concurrency:
  group: issue-intake-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Initialize labels and process issue or PR declarations
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const repo = context.repo;
            const catalog = [
              { name: 'bug', color: 'd73a4a', description: 'An existing behavior is incorrect.' },
              { name: 'enhancement', color: 'a2eeef', description: 'A new or improved capability.' },
              { name: 'area:program', color: '0052cc', description: 'Application logic, UI, settings, or audio.' },
              { name: 'area:waveform', color: '5319e7', description: 'Waveforms, physiology, or measurements.' },
              { name: 'needs-triage', color: 'fbca04', description: 'Awaiting maintainer review.' },
              { name: 'invalid', color: 'e4e669', description: 'This report is not accepted in its current form.' },
              { name: 'triage:blind-check', color: 'b60205', description: 'The submitter selected the blind-checking statement.' },
              { name: 'No human-supervised', color: 'f9d0c4', description: 'The submitter declared an AI-agent submission without human review.' },
              { name: 'Suspicious human-supervised', color: 'fbca04', description: 'The submitter declared that human review status is unknown.' }
            ];
            const types = new Map([
              ['程序逻辑 Bug / Program bug', ['bug', 'area:program']],
              ['波形问题 / Waveform problem', ['bug', 'area:waveform']],
              ['程序功能建议 / Program feature request', ['enhancement', 'area:program']],
              ['波形功能建议 / Waveform feature request', ['enhancement', 'area:waveform']]
            ]);

            // Forms use level 3 headings; the PR template uses level 2 headings.
            // Only standalone headings count. Ignore HTML comments, quotes and fences.
            function sections(body, level = 3) {
              const found = new Map();
              const prefix = '#'.repeat(level) + ' ';
              let current = null;
              let fence = null;
              const visible = body.replace(/<!--[\s\S]*?(?:-->|$)/g, '');
              for (const line of visible.replace(/\r\n/g, '\n').split('\n')) {
                if (fence) {
                  const end = line.match(/^ {0,3}(`+|~+)\s*$/);
                  if (end && end[1][0] === fence[0] && end[1].length >= fence.length) fence = null;
                  continue;
                }
                const start = line.match(/^ {0,3}(`{3,}|~{3,})/);
                if (start) { fence = start[1]; continue; }
                if (/^#{1,6} /.test(line)) {
                  current = null;
                  if (line.startsWith(prefix)) {
                    const title = line.slice(prefix.length).trim();
                    // Duplicate headings are ambiguous; never act on them.
                    if (found.has(title)) found.set(title, null);
                    else { current = []; found.set(title, current); }
                  }
                } else if (current) current.push(line);
              }
              return new Map([...found].map(([title, lines]) => [title, lines?.join('\n').trim()]));
            }

            function checkedItems(section) {
              return (section || '').split('\n')
                .map(line => /^- \[[xX]\] (.+?)\s*$/.exec(line))
                .filter(Boolean).map(match => match[1]);
            }

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({ ...repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({ ...repo, ...label });
                } catch (creationError) {
                  if (creationError.status !== 422) throw creationError;
                  // Another issue may have created it concurrently. Verify existence.
                  await github.rest.issues.getLabel({ ...repo, name: label.name });
                }
              }
            }

            const isPr = context.eventName === 'pull_request_target';
            if (context.eventName !== 'issues' && !isPr) {
              for (const label of catalog) await ensureLabel(label);
              return;
            }

            // Read current content so an old queued edit cannot close a corrected issue.
            const issue_number = isPr ? context.payload.pull_request.number : context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({ ...repo, issue_number });
            if (Boolean(issue.pull_request) !== isPr || issue.state !== 'open') return;

            // PR intake can only add labels. It never enters the issue-closing branch.
            if (isPr) {
              const fields = sections(issue.body || '', 2);
              const origin = checkedItems(fields.get('内容来源与人工审核 / Content origin and human review'));
              const noHumanReview = origin.length === 1 && origin[0]
                === 'Agent 自动提交，本次改动未经人类审核 / Submitted automatically by an AI agent without human review';
              const unknownReview = origin.length === 1 && origin[0]
                === '无法确认是否经过人类审核 / Human review status is unknown';
              const blind = checkedItems(fields.get('提交前确认 / Submission checklist'))
                .includes("I'm checking these boxes blindly.");
              const labels = [];
              if (noHumanReview) labels.push('No human-supervised');
              if (unknownReview) labels.push('Suspicious human-supervised');
              if (blind) labels.push('triage:blind-check');
              for (const name of labels) await ensureLabel(catalog.find(label => label.name === name));
              if (labels.length) await github.rest.issues.addLabels({ ...repo, issue_number, labels });
              return;
            }

            const fields = sections(issue.body || '');
            const typeLabels = types.get(fields.get('反馈类型 / Issue type'));
            if (!typeLabels) return;

            const checklist = fields.get('提交前确认 / Submission checklist') || '';
            const items = checklist.split('\n').filter(line => line.trim()).map(
              line => /^- \[([ xX])\] (.+?)\s*$/.exec(line)
            );
            const expected = [
              '我已搜索现有 issues，未找到相同反馈。 / I searched existing issues and found no duplicate.',
              '我理解本项目仅用于教学模拟。 / I understand this project is for teaching simulation only.',
              "I'm checking these boxes blindly.",
              '我已核对以上信息，并愿意按需补充定位材料。 / I checked the information above and can provide clarification if needed.'
            ];
            const blind = items.length === expected.length
              && items.every((item, index) => item && item[2] === expected[index])
              && items[2][1].toLowerCase() === 'x';

            // Keep manual triage on later edits; only rejected reports get new labels then.
            const labels = blind ? ['invalid', 'triage:blind-check']
              : context.payload.action === 'opened' ? [...typeLabels, 'needs-triage'] : [];
            if (fields.get('内容来源与人工审核 / Content origin and human review')
                === 'Agent 自动提交，本次内容未经人类审核 / Submitted automatically by an AI agent without human review') {
              labels.push('No human-supervised');
            }
            if (fields.get('内容来源与人工审核 / Content origin and human review')
                === '无法确认是否经过人类审核 / Human review status is unknown') {
              labels.push('Suspicious human-supervised');
            }
            for (const name of labels) await ensureLabel(catalog.find(label => label.name === name));
            if (labels.length) await github.rest.issues.addLabels({ ...repo, issue_number, labels });
            if (blind) {
              try {
                await github.rest.issues.removeLabel({ ...repo, issue_number, name: 'needs-triage' });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.issues.update({ ...repo, issue_number, state: 'closed', state_reason: 'not_planned' });
            }
